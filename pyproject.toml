[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gameguidelm"
version = "1.2.0"
description = "A grounded multi-game Qwen language model with evidence-aware LoRA and speculative decoding experiments"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ez4Allen" }]
keywords = [
  "large-language-models",
  "retrieval-augmented-generation",
  "grounded-generation",
  "qwen",
  "lora",
  "speculative-decoding",
  "game-guides",
]
dependencies = [
  "torch>=2.1",
  "transformers>=4.51.0,<5.0",
  "accelerate>=0.30",
  "datasets>=2.18",
  "tokenizers>=0.21",
  "pandas>=2.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
]

[project.scripts]
gameguidelm = "src.gameguide.cli:main"

[project.optional-dependencies]
training = [
  "peft>=0.12",
  "bitsandbytes>=0.46; platform_system == 'Linux'",
]
metrics = [
  "bert-score>=0.3.13",
]
dev = [
  "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/Ez4Allen/GameGuide-LLM"
Documentation = "https://github.com/Ez4Allen/GameGuide-LLM/tree/main/docs"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: builds and validates local SQLite knowledge stores",
  "gpu: requires CUDA and external model checkpoints",
]
