
experiment_name: terraria_qwen3_4b_qlora_smoke

model:
  model_name_or_path: /content/drive/MyDrive/LLM_Project/models/Qwen3-4B-Instruct-2507
  trust_remote_code: true

data:
  train_path: /content/llm_project/data/terraria/terraria_train_v1.jsonl
  validation_path: /content/llm_project/data/terraria/terraria_validation_v1.jsonl
  max_length: 512

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: auto

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  bias: none

training:
  output_dir: /content/drive/MyDrive/LLM_Project/checkpoints/terraria_qwen3_4b_qlora_smoke

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8

  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: linear
  max_grad_norm: 1.0

  max_steps: 10

  logging_steps: 1
  eval_steps: 5
  save_steps: 5
  save_total_limit: 2

  gradient_checkpointing: true
  optim: paged_adamw_8bit

  seed: 42
  dataloader_num_workers: 0
