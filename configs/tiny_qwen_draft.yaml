# From-scratch sequence adaptation for the custom speculative draft.
# Generate target-teacher examples first with scripts/generate_teacher_answers.py.
model:
  target_model_name_or_path: Qwen/Qwen3-4B
  tokenizer_name_or_path: Qwen/Qwen3-4B
  local_files_only: false
  hidden_size: 256
  intermediate_size: 768
  num_hidden_layers: 6
  num_attention_heads: 4
  num_key_value_heads: 2
  max_position_embeddings: 4096
  rope_theta: 1000000.0
  rms_norm_eps: 1.0e-6
  attention_dropout: 0.0
  initializer_range: 0.02

data:
  train_path: data/gameguide/target_teacher_train.jsonl
  validation_path: data/gameguide/target_teacher_validation.jsonl
  max_length: 512

training:
  output_dir: results/tiny_qwen_draft
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-4
  weight_decay: 0.01
  max_steps: 1000
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  logging_steps: 10
  eval_steps: 100
  eval_batches: 20
  save_steps: 250
  seed: 42
  device: auto
  compute_dtype: auto
  num_workers: 0
