experiment_name: gameguidelm_qwen3_4b_grounded_lora

model:
  model_name_or_path: Qwen/Qwen3-4B
  trust_remote_code: false

data:
  train_path: data/gameguide/grounded_train.jsonl
  validation_path: data/gameguide/grounded_validation.jsonl
  max_length: 6144

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: auto

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  bias: none

training:
  output_dir: results/training/gameguidelm_qwen3_4b_grounded_lora
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: linear
  max_grad_norm: 1.0
  num_train_epochs: 2
  max_steps: -1
  logging_steps: 5
  eval_steps: 50
  save_steps: 50
  save_total_limit: 2
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  seed: 42
  dataloader_num_workers: 0
